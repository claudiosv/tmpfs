[project]
name = "tmpfs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claudio Spiess", email = "claudiosv@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
    "pydantic>=2.14.0b1",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
    "typer>=0.27.1",
]

[project.scripts]
tmpfs = "tmpfs.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tmpfs --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/tmpfs"]

[tool.coverage.html]
directory = "htmlcov"
